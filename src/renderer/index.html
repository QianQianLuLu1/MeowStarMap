<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- CSP 与主进程 onHeadersReceived 下发的响应头保持一致，见 src/main/app/window-manager.ts。
       两处都加：响应头缺失时 meta 兜底，HTML 被篡改时响应头兜底。
       script-src 不给 inline/eval，XSS 便无法执行脚本去调用 window.electronAPI 触达 IPC。
       style-src 需要 inline：React style 属性与运行时注入的样式。
       img-src / media-src 放行 media:：本地图片与视频走自定义 media:// 协议。
       注意：charset 必须留在 head 前 1024 字节内，本注释不要再往上挪。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; object-src 'none'; img-src 'self' media: data:; media-src 'self' media:; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>喵星图</title>
  <style>
    /* 防止 FOUC：默认简约主题背景色，柔粉轻奢主题由 CSS 类覆盖 */
    html { background: #F5F5F5; }
    html.soft-pink-luxury { background: #fdf9fb; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
