[package]
name = "meowstarmap-installer"
version = "0.1.0"
description = "MeowStarMap custom installer (Tauri)"
authors = ["MeowStarMap"]
edition = "2021"

[lib]
name = "meow_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
